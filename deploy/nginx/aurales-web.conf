# Copy to /etc/nginx/sites-available/aurales and replace the domain and root.
# `dist-web/` contents must be copied directly into /var/www/aurales.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aurales.example.com;

    root /var/www/aurales;
    index index.html;

    # Configure certificate paths for your TLS provider (for example, Certbot).
    ssl_certificate /etc/letsencrypt/live/aurales.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurales.example.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The PWA shell and service worker must revalidate after each deployment.
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Vite output filenames are content-hashed. Keep these immutable.
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Other public root assets (icons, etc.) may be cached briefly.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name aurales.example.com;
    return 301 https://$host$request_uri;
}
