services:
  web:
    build:
      context: .
      target: web-runtime
      args:
        VITE_TMDB_API_KEY: ${VITE_TMDB_API_KEY:-}
        VITE_TVDB_API_KEY: ${VITE_TVDB_API_KEY:-}
        VITE_OMDB_API_KEY: ${VITE_OMDB_API_KEY:-}
        VITE_SIMKL_V2_CLIENT_ID: ${VITE_SIMKL_V2_CLIENT_ID:-}
        VITE_SIMKL_WEB_REDIRECT_URI: ${VITE_SIMKL_WEB_REDIRECT_URI:-}
        VITE_TRAKT_CLIENT_ID: ${VITE_TRAKT_CLIENT_ID:-}
        VITE_ANILIST_WEB_CLIENT_ID: ${VITE_ANILIST_WEB_CLIENT_ID:-}
        VITE_ANILIST_CLIENT_ID: ${VITE_ANILIST_CLIENT_ID:-}
        VITE_MDBLIST_CLIENT_ID: ${VITE_MDBLIST_CLIENT_ID:-}
        VITE_MDBLIST_WEB_REDIRECT_URI: ${VITE_MDBLIST_WEB_REDIRECT_URI:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AURALES_DOMAIN: ${AURALES_DOMAIN:?Set AURALES_DOMAIN to the public hostname}
    depends_on:
      media-worker:
        condition: service_started
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  media-worker:
    build:
      context: .
      target: worker-runtime
    restart: unless-stopped
    environment:
      AURALES_MEDIA_API_KEY: ${AURALES_MEDIA_API_KEY:?Set a private key of at least 32 characters}
      AURALES_MEDIA_SESSION_KEY: ${AURALES_MEDIA_SESSION_KEY:?Set a different private key of at least 32 characters}
      AURALES_MEDIA_ACCESS_CODE: ${AURALES_MEDIA_ACCESS_CODE:?Set an instance access code of at least 16 characters}
      AURALES_MEDIA_WEB_ORIGINS: https://${AURALES_DOMAIN:?Set AURALES_DOMAIN}
      AURALES_MEDIA_ALLOWED_HOSTS: ${AURALES_MEDIA_ALLOWED_HOSTS:-}
    volumes:
      - media-conversions:/var/lib/aurales/conversions
    expose:
      - "8188"

volumes:
  media-conversions:
  caddy-data:
  caddy-config:
