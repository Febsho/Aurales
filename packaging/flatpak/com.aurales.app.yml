# Flatpak manifest for Aurales. CI creates a private .deb build input and copies
# it next to this file as aurales.deb. The .deb is never published as a release
# asset; public Linux downloads are the AppImage and Flatpak bundle.
# The GNOME runtime ships the WebKitGTK 4.1 the Tauri WebView needs.
id: com.aurales.app
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: aurales
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  # Aurales prefers XWayland when it is available because WebKitGTK cannot
  # reliably composite its transparent controls over GtkGLArea on native
  # Wayland/NVIDIA. `fallback-x11` hides DISPLAY whenever Wayland is present,
  # preventing the runtime safeguard in src-tauri/src/lib.rs from activating.
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  # Discord Rich Presence IPC socket (harmless if Discord is absent)
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/discord-ipc-1
  - --filesystem=xdg-run/discord-ipc-2
  - --filesystem=xdg-run/discord-ipc-3
  - --filesystem=xdg-run/discord-ipc-4
  - --filesystem=xdg-run/discord-ipc-5
  - --filesystem=xdg-run/discord-ipc-6
  - --filesystem=xdg-run/discord-ipc-7
  - --filesystem=xdg-run/discord-ipc-8
  - --filesystem=xdg-run/discord-ipc-9
modules:
  # GNOME Platform provides FFmpeg and the GPU/audio stack, but not libmpv.
  # Build mpv in the sandbox so the Flatpak always uses the same native player
  # as the AppImage without depending on host packages.
  - name: libass
    cleanup:
      - /include
      - /lib/pkgconfig
    config-opts:
      - --disable-static
      - --enable-asm
      - --enable-fontconfig
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dvulkan=enabled
      - -Dshaderc=enabled
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dbuild-date=false
      - -Dcplayer=true
      - -Dlibmpv=true
      - -Dtests=false
      - -Djavascript=disabled
      - -Dlua=disabled
      - -Dwerror=false
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/applications
      - /share/bash-completion
      - /share/icons
      - /share/man
      - /share/zsh
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413

  - name: aurales
    buildsystem: simple
    build-commands:
      - ar -x aurales.deb
      - tar -xf data.tar.gz
      # The private .deb also feeds the self-contained AppImage build, so it
      # contains Linux media sidecars. Only import the application and yt-dlp:
      # mpv/libmpv come from the sandbox modules above and FFmpeg from GNOME.
      - install -Dm755 usr/bin/aurales-app /app/bin/aurales-app
      - install -Dm755 usr/bin/yt-dlp /app/bin/yt-dlp
      # The main binary name follows productName; create a stable launcher name.
      - ln -s aurales-app /app/bin/aurales
      - mkdir -p /app/lib/Aurales
      - cp -a usr/lib/Aurales/mpv-scripts /app/lib/Aurales/
      - cp -a usr/lib/Aurales/mpv-script-opts /app/lib/Aurales/
      - |
        desktop=$(ls usr/share/applications/*.desktop | head -n1)
        install -Dm644 "$desktop" /app/share/applications/com.aurales.app.desktop
        sed -i 's/^Icon=.*/Icon=com.aurales.app/' /app/share/applications/com.aurales.app.desktop
      - |
        for icon in usr/share/icons/hicolor/*/apps/*.png; do
          [ -e "$icon" ] || continue
          size=$(basename "$(dirname "$(dirname "$icon")")")
          install -Dm644 "$icon" "/app/share/icons/hicolor/$size/apps/com.aurales.app.png"
        done
      - install -Dm644 com.aurales.app.metainfo.xml /app/share/metainfo/com.aurales.app.metainfo.xml
    sources:
      - type: file
        path: aurales.deb
      - type: file
        path: com.aurales.app.metainfo.xml
