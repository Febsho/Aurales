<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://s4.anilist.co" crossorigin />
    <link rel="preconnect" href="https://webservice.fanart.tv" crossorigin />
    <link rel="preconnect" href="https://artworks.thetvdb.com" crossorigin />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <link rel="dns-prefetch" href="https://simkl.in" />
    <link rel="dns-prefetch" href="https://api4.thetvdb.com" />
    <link rel="dns-prefetch" href="https://assets.fanart.tv" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Aurales" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Apply the persisted surface before the first paint. React repeats this
      // after hydration, but doing it here avoids a bright/incorrect flash on
      // cold start.
      try {
        const background = localStorage.getItem('aurales_theme_background');
        document.documentElement.dataset.themeBackground = background === 'slate' || background === 'oled' ? background : 'graphite';
      } catch (_) {}
    </script>
    <title>Aurales</title>
    <!-- Critical inline styles: paint black immediately, before the JS/CSS bundle arrives -->
    <style>
      html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
      #root { height: 100%; }
    </style>
  </head>
  <body class="bg-black text-white overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
