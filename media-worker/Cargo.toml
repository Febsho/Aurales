[package]
name = "aurales-media-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Optional authenticated Aurales web service"

[dependencies]
aurales-domain = { path = "../packages/aurales-domain" }
async-stream = "0.3"
axum = "0.8.9"
futures-util = "0.3"
hmac = "0.12"
http = "1"
reqwest = { version = "0.13.5", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
